<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Estoque Mobile | Conferência de Estoque</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="conferencia-180.png">
<link rel="manifest" href="manifest-conferencia.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --verde-escuro:#0f3d2e;
    --verde:#1b5e42;
    --dourado:#c9a227;
    --dourado-claro:#e6c862;
    --bg:#f4f6f5;
    --card:#ffffff;
    --texto:#1c2b24;
    --texto-suave:#5b6b63;
    --vermelho:#c0392b;
    --verde-ok:#2e7d4f;
    --borda:#e1e6e3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Manrope',sans-serif; background:var(--bg); color:var(--texto);
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--verde-escuro),var(--verde));
    padding:22px 18px 26px; color:#fff;
    border-bottom:3px solid var(--dourado);
  }
  header .topo{display:flex; align-items:center; gap:12px;}
  header .badge{
    background:#fff; border-radius:14px; padding:6px 12px; display:flex;
    align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  header .badge img{height:36px; display:block;}
  header h1{margin:10px 0 1px; font-size:20px; font-weight:800; letter-spacing:-.2px;}
  header p{margin:0; font-size:12.5px; color:var(--dourado-claro); font-weight:600;}
  header .tagline{margin:2px 0 0; font-size:10.5px; color:rgba(255,255,255,.55); font-weight:500; letter-spacing:.3px;}
  .atualizado{
    text-align:center; font-size:11.5px; color:var(--texto-suave); margin:10px 0 -2px;
  }
  .resumo-dia{
    display:none; background:linear-gradient(135deg,var(--verde-escuro),var(--verde));
    color:#fff; border-radius:14px; padding:12px 16px; margin:12px 0 -2px;
    font-size:13px; font-weight:700; text-align:center;
    box-shadow:0 6px 16px rgba(15,61,46,.2);
  }
  .resumo-dia b{color:var(--dourado-claro); font-size:15px;}
  mark{background:var(--dourado-claro); color:var(--verde-escuro); border-radius:3px; padding:0 1px;}

  .container{max-width:640px; margin:-14px auto 0; padding:0 14px;}

  .card{
    background:var(--card); border-radius:18px; padding:20px;
    box-shadow:0 8px 24px rgba(15,61,46,.07); margin-bottom:16px;
    border:1px solid var(--borda);
  }
  .card h2{
    font-size:14px; margin:0 0 14px; color:var(--verde-escuro); font-weight:800;
    text-transform:uppercase; letter-spacing:.6px;
  }

  label{display:block; font-size:12.5px; font-weight:700; color:var(--texto-suave); margin:10px 0 4px;}
  input,select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--borda);
    font-family:inherit; font-size:14.5px; background:#fbfcfb; color:var(--texto);
  }
  input:focus,select:focus{outline:none; border-color:var(--verde);}

  .linha2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  #resultado-busca{
    max-height:180px; overflow-y:auto; border-radius:10px; margin-top:4px;
    display:none; border:1.5px solid var(--borda); background:#fff;
  }
  #resultado-busca div{padding:10px 12px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--borda);}
  #resultado-busca div:hover{background:#f0f4f1;}
  #resultado-busca div:last-child{border-bottom:none;}

  .info-sistema{
    display:flex; justify-content:space-between; align-items:center;
    background:#f0f4f1; border-radius:10px; padding:10px 12px; margin-top:10px;
    font-size:13.5px; display:none;
  }
  .info-sistema b{color:var(--verde-escuro);}

  .diferenca-box{
    margin-top:10px; padding:12px; border-radius:10px; text-align:center;
    font-weight:800; font-size:15px; display:none;
  }
  .diferenca-ok{background:#e6f4ea; color:var(--verde-ok);}
  .diferenca-neg{background:#fdecea; color:var(--vermelho);}
  .diferenca-pos{background:#fff6e0; color:#8a6d00;}

  button{
    width:100%; padding:13px; border:none; border-radius:12px; font-family:inherit;
    font-weight:800; font-size:14.5px; cursor:pointer; margin-top:14px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:active{transform:scale(.98);}
  .btn-salvar{background:var(--verde-escuro); color:#fff; box-shadow:0 4px 12px rgba(15,61,46,.25);}
  .btn-salvar:disabled{background:#9fb3ab; cursor:not-allowed; box-shadow:none;}
  .btn-whats{background:#25d366; color:#fff; box-shadow:0 4px 12px rgba(37,211,102,.3);}
  .btn-vencidos{background:var(--vermelho); color:#fff; box-shadow:0 4px 12px rgba(192,57,43,.3);}
  .btn-pdf{background:var(--dourado); color:#3a2f00; box-shadow:0 4px 12px rgba(201,162,39,.3);}
  .btn-recorrente{background:var(--verde-escuro); color:#fff; box-shadow:0 4px 12px rgba(15,61,46,.25); margin-top:0;}

  .rec-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--borda); font-size:13.5px;
  }
  .rec-item:last-child{border-bottom:none;}
  .rec-item .rec-nome{font-weight:700; color:var(--texto);}
  .rec-item .rec-meta{font-size:11.5px; color:var(--texto-suave); margin-top:2px;}
  .rec-item .rec-count{
    background:#fdecea; color:var(--vermelho); font-weight:800; font-size:13px;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }

  .filtros{display:flex; gap:8px; margin-bottom:12px;}
  .filtros select{flex:1;}

  .item-conf{
    padding:12px 0; border-bottom:1px solid var(--borda); font-size:13.5px;
  }
  .item-conf:last-child{border-bottom:none;}
  .item-conf .topo-item{display:flex; justify-content:space-between; font-weight:700; color:var(--verde-escuro);}
  .item-conf .meta{color:var(--texto-suave); font-size:12px; margin-top:2px;}
  .tag-dif{
    display:inline-block; margin-top:6px; padding:3px 9px; border-radius:20px;
    font-size:12px; font-weight:800;
  }
  .tag-ok{background:#e6f4ea; color:var(--verde-ok);}
  .tag-falta{background:#fdecea; color:var(--vermelho);}
  .tag-sobra{background:#fff6e0; color:#8a6d00;}

#lista-conferencias{
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
  }
  #lista-conferencias::-webkit-scrollbar{width:6px;}
  #lista-conferencias::-webkit-scrollbar-thumb{background:var(--borda); border-radius:10px;}

  .vazio{text-align:center; color:var(--texto-suave); font-size:13.5px; padding:20px 0;}
  .loading{text-align:center; padding:14px; color:var(--texto-suave); font-size:13px;}
  .check-confirmar{
    display:flex; align-items:center; gap:7px; margin-top:14px; font-size:12.5px;
    font-weight:600; color:var(--texto-suave); cursor:pointer;
  }
  .check-confirmar input{width:auto; margin:0;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,24,20,.6); z-index:999;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-card{
    background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:640px;
    max-height:80vh; display:flex; flex-direction:column; padding:20px;
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .modal-card h3{
    margin:0 0 4px; font-size:16px; color:var(--verde-escuro); font-weight:800;
  }
  .modal-card .modal-sub{font-size:12.5px; color:var(--texto-suave); margin:0 0 12px;}
  .modal-lista{overflow-y:auto; flex:1; border-top:1px solid var(--borda); margin-bottom:14px;}
  .modal-item{
    padding:10px 0; border-bottom:1px solid var(--borda); font-size:13.5px;
    display:flex; justify-content:space-between;
  }
  .modal-item span{color:var(--texto-suave); font-size:12px;}
  .modal-botoes{display:flex; gap:10px;}
  .modal-botoes button{margin-top:0; flex:1;}
  .modal-btn-voltar{background:var(--verde-escuro); color:#fff;}
  .modal-btn-continuar{background:#f0f4f1; color:var(--texto-suave); box-shadow:none;}
</style>
</head>
<body>

<header>
  <div class="topo">
    <div class="badge"><img src="logo.png" alt="Setec Agro"></div>
    <div>
      <h1>Estoque Mobile</h1>
      <p>Setec / JSM</p>
      <p class="tagline">Conferência de Estoque</p>
    </div>
  </div>
</header>

<div class="container">
  <div class="atualizado" id="estoque-atualizado"></div>
  <div class="resumo-dia" id="resumo-dia"></div>

  <!-- FORMULÁRIO DE CONTAGEM -->
  <div class="card">
    <h2>Nova contagem</h2>

    <label>Seu nome</label>
    <select id="encarregado">
      <option value="">Selecione seu nome</option>
      <option value="Adelio">Adelio</option>
      <option value="Bruno">Bruno</option>
      <option value="Eldes">Eldes</option>
      <option value="Indigo">Indigo</option>
      <option value="Kaique">Kaique</option>
      <option value="Leopoldo">Leopoldo</option>
      <option value="Paulo">Paulo</option>
      <option value="__outro__">Outro (digitar nome)</option>
    </select>
    <input type="text" id="encarregado-outro" placeholder="Digite seu nome" style="display:none; margin-top:8px;">

    <label>Loja</label>
    <select id="loja">
      <option value="">Selecione a loja</option>
      <option value="001">001 - JSM Uberlândia</option>
      <option value="002">002 - JSM Depósito Aeroporto</option>
      <option value="003">003 - JSM Araguari</option>
      <option value="004">004 - JSM Capinópolis</option>
      <option value="005">005 - JSM Nova Ponte</option>
      <option value="010">010 - Setec Uberlândia</option>
      <option value="011">011 - Setec Araguari</option>
      <option value="012">012 - Setec Capinópolis</option>
      <option value="013">013 - Setec Nova Ponte</option>
    </select>

    <label>Produto</label>
    <input type="text" id="busca-produto" placeholder="Digite para buscar o produto..." autocomplete="off">
    <div id="resultado-busca"></div>

    <div class="info-sistema" id="info-sistema">
      <span>Estoque no sistema:</span>
      <b id="qtd-sistema">-</b>
    </div>

    <label>Quantidade contada</label>
    <input type="number" step="0.01" id="qtd-contada" placeholder="0">

    <label>Validade do produto <span style="font-weight:400; text-transform:none; letter-spacing:0;">(opcional)</span></label>
    <input type="date" id="validade">

    <div class="diferenca-box" id="diferenca-box"></div>

    <label class="check-confirmar">
      <input type="checkbox" id="check-confirmar" checked>
      Pedir confirmação antes de salvar
    </label>

    <button class="btn-salvar" id="btn-salvar" disabled>Salvar contagem</button>
  </div>

  <!-- PAINEL COMPARTILHADO -->
  <div class="card">
    <h2>Conferências recentes (todas)</h2>

    <div class="filtros">
      <select id="filtro-loja">
        <option value="">Todas as lojas</option>
        <option value="001">001 - JSM Uberlândia</option>
        <option value="002">002 - JSM Depósito Aeroporto</option>
        <option value="003">003 - JSM Araguari</option>
        <option value="004">004 - JSM Capinópolis</option>
        <option value="005">005 - JSM Nova Ponte</option>
        <option value="010">010 - Setec Uberlândia</option>
        <option value="011">011 - Setec Araguari</option>
        <option value="012">012 - Setec Capinópolis</option>
        <option value="013">013 - Setec Nova Ponte</option>
      </select>
      <select id="filtro-tipo">
        <option value="">Todas</option>
        <option value="divergente">Só divergências</option>
      </select>
    </div>

    <div id="lista-conferencias"><div class="loading">Carregando...</div></div>

    <button class="btn-pdf" id="btn-pdf">📄 Finalizar conferência (gerar PDF)</button>
    <button class="btn-whats" id="btn-whatsapp" style="display:none;">Compartilhar divergências no WhatsApp</button>
    <button class="btn-vencidos" id="btn-vencidos" style="display:none;">⚠️ Compartilhar vencidos no WhatsApp</button>
  </div>

  <!-- DIVERGÊNCIAS RECORRENTES -->
  <div class="card">
    <h2>Divergências recorrentes</h2>
    <p style="font-size:12.5px; color:var(--texto-suave); margin:-8px 0 12px;">Produtos que mais divergiram ao longo do tempo</p>
    <button class="btn-recorrente" id="btn-recorrente">🔎 Ver divergências recorrentes</button>
    <div id="lista-recorrentes" style="display:none; margin-top:14px;"></div>
  </div>

</div>

<script>
// ============================================================
// Copie a MESMA URL e KEY já usadas no index.html (Estoque Mobile)
// ============================================================
const SUPABASE_URL = "https://wmgudywwvfzzsjjshezv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtZ3VkeXd3dmZ6enNqanNoZXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTcwMzEsImV4cCI6MjEwMjEzMzAzMX0.c6aeTOpeqOlcHjvZHmXXhya9VsWB-q1SR2oxiMEpO4s";

const NOMES_LOJA = {
  "001":"JSM Uberlândia","002":"JSM Depósito Aeroporto","003":"JSM Araguari",
  "004":"JSM Capinópolis","005":"JSM Nova Ponte","010":"Setec Uberlândia",
  "011":"Setec Araguari","012":"Setec Capinópolis","013":"Setec Nova Ponte"
};

function headers(){
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
  };
}

// --- estado da contagem em andamento ---
let produtoSelecionado = null; // {produto, unidade, quantidade}
let debounceBusca = null;

// "finalizada" agora é persistido no localStorage por loja+dia, então
// sobrevive a F5 / fechar e abrir o navegador de novo (antes era só uma
// variável em memória, que resetava sozinha ao recarregar a página)
function chaveFinalizada(loja){
  const hoje = new Date();
  const dataStr = `${hoje.getFullYear()}-${hoje.getMonth()+1}-${hoje.getDate()}`;
  return `conf_finalizada_${loja}_${dataStr}`;
}
function estaFinalizada(loja){
  if (!loja) return false;
  return localStorage.getItem(chaveFinalizada(loja)) === 'true';
}
function marcarFinalizada(loja){
  localStorage.setItem(chaveFinalizada(loja), 'true');
}
function desmarcarFinalizada(loja){
  localStorage.removeItem(chaveFinalizada(loja));
}

// lembrar nome do encarregado
const inputEncarregado = document.getElementById('encarregado');
const inputEncarregadoOutro = document.getElementById('encarregado-outro');

function getNomeEncarregado(){
  if (inputEncarregado.value === '__outro__') return inputEncarregadoOutro.value.trim();
  return inputEncarregado.value;
}

const nomeSalvo = localStorage.getItem('conf_encarregado') || '';
const opcoesConhecidas = ['Adelio','Bruno','Eldes','Indigo','Kaique','Leopoldo','Paulo'];
if (nomeSalvo && opcoesConhecidas.includes(nomeSalvo)){
  inputEncarregado.value = nomeSalvo;
} else if (nomeSalvo){
  inputEncarregado.value = '__outro__';
  inputEncarregadoOutro.value = nomeSalvo;
  inputEncarregadoOutro.style.display = 'block';
}

inputEncarregado.addEventListener('change', () => {
  inputEncarregadoOutro.style.display = inputEncarregado.value === '__outro__' ? 'block' : 'none';
  localStorage.setItem('conf_encarregado', getNomeEncarregado());
  validarFormulario();
});
inputEncarregadoOutro.addEventListener('input', () => {
  localStorage.setItem('conf_encarregado', getNomeEncarregado());
  validarFormulario();
});

const selectLoja = document.getElementById('loja');
selectLoja.value = localStorage.getItem('conf_loja') || '';
selectLoja.addEventListener('change', () => {
  localStorage.setItem('conf_loja', selectLoja.value);
  document.getElementById('busca-produto').value = '';
  document.getElementById('resultado-busca').style.display = 'none';
  produtoSelecionado = null;
  esconderInfoSistema();
  validarFormulario();
  atualizarResumoDia();

  // acompanha a loja escolhida pra conferência no filtro do painel de baixo
  const filtroLoja = document.getElementById('filtro-loja');
  if (filtroLoja.value !== selectLoja.value){
    filtroLoja.value = selectLoja.value;
    carregarConferencias();
  }
});

// lembrar preferência de pedir confirmação antes de salvar
const checkConfirmar = document.getElementById('check-confirmar');
checkConfirmar.checked = localStorage.getItem('conf_pedir_confirmacao') !== 'false';
checkConfirmar.addEventListener('change', () => {
  localStorage.setItem('conf_pedir_confirmacao', checkConfirmar.checked);
});

// --- busca de produto (autocomplete) ---
const inputBusca = document.getElementById('busca-produto');
const boxResultado = document.getElementById('resultado-busca');

inputBusca.addEventListener('input', () => {
  produtoSelecionado = null;
  esconderInfoSistema();
  validarFormulario();
  clearTimeout(debounceBusca);
  const termo = inputBusca.value.trim();
  const loja = selectLoja.value;
  if (!loja) { boxResultado.style.display='none'; return; }
  if (termo.length < 2) { boxResultado.style.display='none'; return; }
  debounceBusca = setTimeout(() => buscarProduto(termo, loja), 300);
});

function destacarTermo(texto, termo){
  if (!termo) return texto;
  const escapado = termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return texto.replace(new RegExp(`(${escapado})`, 'gi'), '<mark>$1</mark>');
}

async function buscarProduto(termo, loja){
  try {
    const url = `${SUPABASE_URL}/rest/v1/estoque_fisico?loja=eq.${loja}&produto=ilike.*${encodeURIComponent(termo)}*&select=produto,unidade,quantidade&limit=15&order=produto`;
    const resp = await fetch(url, { headers: headers() });
    const dados = await resp.json();
    if (!dados.length){
      boxResultado.innerHTML = '<div style="color:#999;">Nenhum produto encontrado nessa loja</div>';
      boxResultado.style.display = 'block';
      return;
    }
    boxResultado.innerHTML = dados.map(p =>
      `<div data-produto="${encodeURIComponent(p.produto)}" data-un="${p.unidade||''}" data-qtd="${p.quantidade}">${destacarTermo(p.produto, termo)} <span style="color:#999;">(${p.unidade||''})</span></div>`
    ).join('');
    boxResultado.style.display = 'block';
  } catch(e){
    console.error(e);
  }
}

boxResultado.addEventListener('click', (ev) => {
  const alvo = ev.target.closest('div[data-produto]');
  if (!alvo) return;
  produtoSelecionado = {
    produto: decodeURIComponent(alvo.dataset.produto),
    unidade: alvo.dataset.un,
    quantidade: parseFloat(alvo.dataset.qtd)
  };
  inputBusca.value = produtoSelecionado.produto;
  boxResultado.style.display = 'none';
  mostrarInfoSistema(produtoSelecionado.quantidade);
  calcularDiferenca();
  validarFormulario();
});

function mostrarInfoSistema(qtd){
  document.getElementById('info-sistema').style.display = 'flex';
  document.getElementById('qtd-sistema').textContent = qtd;
}
function esconderInfoSistema(){
  document.getElementById('info-sistema').style.display = 'none';
  document.getElementById('diferenca-box').style.display = 'none';
}

// --- diferença em tempo real ---
const inputContada = document.getElementById('qtd-contada');
inputContada.addEventListener('input', () => { calcularDiferenca(); validarFormulario(); });

function calcularDiferenca(){
  const box = document.getElementById('diferenca-box');
  if (!produtoSelecionado || inputContada.value === ''){
    box.style.display = 'none';
    return;
  }
  const contada = parseFloat(inputContada.value) || 0;
  const dif = contada - produtoSelecionado.quantidade;
  box.style.display = 'block';
  if (dif === 0){
    box.className = 'diferenca-box diferenca-ok';
    box.textContent = 'Bateu certinho ✓';
  } else if (dif < 0){
    box.className = 'diferenca-box diferenca-neg';
    box.textContent = `Faltam ${Math.abs(dif)} ${produtoSelecionado.unidade||''}`;
  } else {
    box.className = 'diferenca-box diferenca-pos';
    box.textContent = `Sobram ${dif} ${produtoSelecionado.unidade||''}`;
  }
}

function validarFormulario(){
  const ok = getNomeEncarregado() && selectLoja.value &&
             produtoSelecionado && inputContada.value !== '';
  document.getElementById('btn-salvar').disabled = !ok;
}

// --- salvar contagem ---
document.getElementById('btn-salvar').addEventListener('click', async () => {
  const btn = document.getElementById('btn-salvar');

  // confirmação (se o checkbox estiver marcado)
  if (checkConfirmar.checked){
    const ok = confirm(`Confirma a contagem?\n\n${produtoSelecionado.produto}\nQuantidade: ${inputContada.value} ${produtoSelecionado.unidade||''}`);
    if (!ok) return;
  }

  btn.disabled = true;
  btn.textContent = 'Salvando...';
  try {
    const loja = selectLoja.value;
    const produto = produtoSelecionado.produto;

    // checa se esse produto já foi contado hoje nessa loja
    const hoje = new Date();
    const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();
    const urlCheck = `${SUPABASE_URL}/rest/v1/conferencias?select=id,quantidade_contada&loja=eq.${loja}&produto=eq.${encodeURIComponent(produto)}&criado_em=gte.${inicioDia}`;
    const respCheck = await fetch(urlCheck, { headers: headers() });
    const existentes = await respCheck.json();

    const corpo = {
      encarregado: getNomeEncarregado(),
      loja: loja,
      empresa: NOMES_LOJA[loja] || loja,
      produto: produto,
      unidade: produtoSelecionado.unidade,
      quantidade_sistema: produtoSelecionado.quantidade,
      quantidade_contada: parseFloat(inputContada.value),
      validade: document.getElementById('validade').value || null
    };

    if (existentes.length){
      const anterior = existentes[0];
      const substituir = confirm(`Você já contou "${produto}" hoje (${anterior.quantidade_contada} ${produtoSelecionado.unidade||''}).\n\nSubstituir pela nova contagem (${corpo.quantidade_contada})?`);
      if (!substituir){
        btn.textContent = 'Salvar contagem';
        btn.disabled = false;
        return;
      }
      // atualiza o registro existente em vez de criar um novo
      const respUpd = await fetch(`${SUPABASE_URL}/rest/v1/conferencias?id=eq.${anterior.id}`, {
        method: 'PATCH',
        headers: { ...headers(), 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          encarregado: corpo.encarregado,
          quantidade_sistema: corpo.quantidade_sistema,
          quantidade_contada: corpo.quantidade_contada,
          validade: corpo.validade,
          criado_em: new Date().toISOString()
        })
      });
      if (!respUpd.ok) throw new Error(await respUpd.text());
    } else {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/conferencias`, {
        method: 'POST',
        headers: { ...headers(), 'Prefer': 'return=minimal' },
        body: JSON.stringify(corpo)
      });
      if (!resp.ok) throw new Error(await resp.text());
    }

    // limpa só o produto/quantidade/validade, mantém nome e loja pra próxima contagem
    inputBusca.value = '';
    inputContada.value = '';
    document.getElementById('validade').value = '';
    produtoSelecionado = null;
    esconderInfoSistema();
    desmarcarFinalizada(loja); // uma nova contagem foi salva, volta a mostrar o painel normalmente
    carregarConferencias();
    atualizarResumoDia();
  } catch(e){
    alert('Erro ao salvar. Tente de novo.');
    console.error(e);
  } finally {
    btn.textContent = 'Salvar contagem';
    validarFormulario();
  }
});

// --- resumo do dia (loja selecionada no formulário de contagem) ---
async function atualizarResumoDia(){
  const box = document.getElementById('resumo-dia');
  const loja = selectLoja.value;
  if (!loja){ box.style.display = 'none'; return; }

  if (estaFinalizada(loja)){
    box.style.display = 'block';
    box.innerHTML = `Conferência dessa loja finalizada hoje ✓`;
    return;
  }

  try {
    const hoje = new Date();
    const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();
    const url = `${SUPABASE_URL}/rest/v1/conferencias?select=diferenca&loja=eq.${loja}&criado_em=gte.${inicioDia}`;
    const resp = await fetch(url, { headers: headers() });
    const dados = await resp.json();

    if (!dados.length){ box.style.display = 'none'; return; }

    const divergentes = dados.filter(d => d.diferenca !== 0).length;
    box.style.display = 'block';
    box.innerHTML = `Hoje nessa loja: <b>${dados.length}</b> itens contados &nbsp;·&nbsp; <b>${divergentes}</b> divergência${divergentes === 1 ? '' : 's'}`;
  } catch(e){
    box.style.display = 'none';
  }
}

// --- painel de conferências recentes ---
async function carregarConferencias(){
  const lista = document.getElementById('lista-conferencias');
  const lojaFiltro = document.getElementById('filtro-loja').value;

  atualizarVisibilidadeAlertas(lojaFiltro);

  if (estaFinalizada(lojaFiltro)){
    lista.innerHTML = '<div class="vazio">Conferência finalizada. Inicie uma nova contagem para continuar.</div>';
    return;
  }

  lista.innerHTML = '<div class="loading">Carregando...</div>';
  try {
    let url = `${SUPABASE_URL}/rest/v1/conferencias?select=*&order=criado_em.desc&limit=100`;
    const loja = lojaFiltro;
    if (loja) url += `&loja=eq.${loja}`;

    const resp = await fetch(url, { headers: headers() });
    let dados = await resp.json();

    if (document.getElementById('filtro-tipo').value === 'divergente'){
      dados = dados.filter(d => d.diferenca !== 0);
    }

    if (!dados.length){
      lista.innerHTML = '<div class="vazio">Nenhuma conferência encontrada</div>';
      return;
    }

    lista.innerHTML = dados.map(d => {
      let tagClasse = 'tag-ok', tagTexto = 'Bateu certinho';
      if (d.diferenca < 0){ tagClasse='tag-falta'; tagTexto = `Faltam ${Math.abs(d.diferenca)}`; }
      else if (d.diferenca > 0){ tagClasse='tag-sobra'; tagTexto = `Sobram ${d.diferenca}`; }
      const data = new Date(d.criado_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      const validadeTxt = d.validade ? ` · validade ${new Date(d.validade+'T00:00:00').toLocaleDateString('pt-BR')}` : '';
      return `
        <div class="item-conf">
          <div class="topo-item"><span>${d.produto}</span><span>${d.quantidade_contada} ${d.unidade||''}</span></div>
          <div class="meta">${d.empresa} · ${d.encarregado} · ${data}${validadeTxt}</div>
          <span class="tag-dif ${tagClasse}">${tagTexto}</span>
        </div>`;
    }).join('');
  } catch(e){
    lista.innerHTML = '<div class="vazio">Erro ao carregar</div>';
    console.error(e);
  }
}

document.getElementById('filtro-loja').addEventListener('change', carregarConferencias);
document.getElementById('filtro-tipo').addEventListener('change', carregarConferencias);

// --- mostra/esconde os botões de compartilhar conforme existir ou não
// divergência/vencido HOJE na loja filtrada, pra não poluir a tela em
// dias normais ---
async function atualizarVisibilidadeAlertas(loja){
  const btnDivergencia = document.getElementById('btn-whatsapp');
  const btnVencidos = document.getElementById('btn-vencidos');

  if (!loja){
    btnDivergencia.style.display = 'none';
    btnVencidos.style.display = 'none';
    return;
  }

  try {
    const hoje = new Date();
    const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();
    const url = `${SUPABASE_URL}/rest/v1/conferencias?select=diferenca,validade&loja=eq.${loja}&criado_em=gte.${inicioDia}`;
    const resp = await fetch(url, { headers: headers() });
    const dados = await resp.json();

    const hojeZerado = new Date();
    hojeZerado.setHours(0, 0, 0, 0);

    const temDivergencia = dados.some(d => d.diferenca !== 0);
    const temVencido = dados.some(d => {
      if (!d.validade) return false;
      const dataValidade = new Date(d.validade + 'T00:00:00');
      return dataValidade < hojeZerado;
    });

    btnDivergencia.style.display = temDivergencia ? 'block' : 'none';
    btnVencidos.style.display = temVencido ? 'block' : 'none';
  } catch(e){
    console.error(e);
  }
}

// --- compartilhar vencidos no whatsapp (só produtos vencidos de HOJE, respeitando o filtro de loja atual) ---
document.getElementById('btn-vencidos').addEventListener('click', async () => {
  const loja = document.getElementById('filtro-loja').value;
  const hoje = new Date();
  const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();

  let url = `${SUPABASE_URL}/rest/v1/conferencias?select=*&criado_em=gte.${inicioDia}&order=criado_em.desc&limit=200`;
  if (loja) url += `&loja=eq.${loja}`;
  const resp = await fetch(url, { headers: headers() });
  const dados = await resp.json();

  const hojeZerado = new Date();
  hojeZerado.setHours(0, 0, 0, 0);

    if (!d.validade) return false;
    return new Date(d.validade + 'T00:00:00') < hojeZerado;
  });

  vencidos.forEach(d => {

    texto += `• ${d.produto} (${d.empresa}): venceu em ${dataValidade}\n`;
  });

// --- modal de aviso de produtos ainda não contados ---
function mostrarModalFaltantes(faltantes){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card">
        <h3>⚠️ ${faltantes.length} produto${faltantes.length === 1 ? '' : 's'} ainda não contado${faltantes.length === 1 ? '' : 's'}</h3>
        <p class="modal-sub">Esses produtos existem no sistema pra essa loja mas ainda não foram contados hoje:</p>
        <div class="modal-lista">
          ${faltantes.map(f => `<div class="modal-item"><span>${f.produto}</span><span>${f.unidade || ''}</span></div>`).join('')}
        </div>
        <div class="modal-botoes">
          <button class="modal-btn-voltar">Voltar e contar</button>
          <button class="modal-btn-continuar">Gerar mesmo assim</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.modal-btn-voltar').onclick = () => { overlay.remove(); resolve(false); };
    overlay.querySelector('.modal-btn-continuar').onclick = () => { overlay.remove(); resolve(true); };
  });
}

// --- finalizar conferência: gerar PDF ---
document.getElementById('btn-pdf').addEventListener('click', async () => {
  const loja = document.getElementById('filtro-loja').value;
  if (!loja){
    alert('Escolha uma loja no filtro acima antes de gerar o PDF.');
    return;
  }

  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;
  btn.textContent = 'Gerando PDF...';

  try {
    // pega todas as conferências dessa loja feitas HOJE
    const hoje = new Date();
    const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();

    const url = `${SUPABASE_URL}/rest/v1/conferencias?select=*&loja=eq.${loja}&criado_em=gte.${inicioDia}&order=produto.asc`;
    const resp = await fetch(url, { headers: headers() });
    const dados = await resp.json();

    if (!dados.length){
      alert('Nenhuma conferência encontrada hoje para essa loja.');
      return;
    }

    // checa se falta contar algum produto que existe no sistema pra essa loja
    const urlTodos = `${SUPABASE_URL}/rest/v1/estoque_fisico?loja=eq.${loja}&select=produto,unidade&order=produto`;
    const respTodos = await fetch(urlTodos, { headers: headers() });
    const todosProdutos = await respTodos.json();
    const contadosHoje = new Set(dados.map(d => d.produto));
    const faltantes = todosProdutos.filter(p => !contadosHoje.has(p.produto));

    if (faltantes.length){
      const prosseguir = await mostrarModalFaltantes(faltantes);
      if (!prosseguir){
        btn.disabled = false;
        btn.textContent = '📄 Finalizar conferência (gerar PDF)';
        return;
      }
    }

    const conferente = dados[dados.length - 1].encarregado; // último a contar nessa loja hoje
    const dataFormatada = hoje.toLocaleDateString('pt-BR');
    const empresa = dados[0].empresa;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // --- cabeçalho ---
    doc.setFillColor(15, 61, 46);
    doc.rect(0, 0, 210, 28, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16);
    doc.setFont(undefined, 'bold');
    doc.text('Conferência de Estoque', 14, 12);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text(`Loja: ${empresa}`, 14, 19);
    doc.text(`Conferente: ${conferente}   |   Data: ${dataFormatada}`, 14, 25);

    // --- resumo ---
    const hojeZerado = new Date();
    hojeZerado.setHours(0, 0, 0, 0);

    const vencidoFlags = dados.map(d => {
      const dataValidade = d.validade ? new Date(d.validade + 'T00:00:00') : null;
      return !!(dataValidade && dataValidade < hojeZerado);
    });

    const total = dados.length;
    const divergentes = dados.filter(d => d.diferenca !== 0).length;
    const vencidosCount = vencidoFlags.filter(Boolean).length;
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.text(`Total de itens conferidos: ${total}   |   Divergências: ${divergentes}   |   Vencidos: ${vencidosCount}`, 14, 36);

    // --- tabela ---
    const linhas = dados.map((d, i) => {
      const vencido = vencidoFlags[i];

      let situacao;
      if (d.diferenca === 0) situacao = 'OK';
      else if (d.diferenca < 0) situacao = `FALTA ${Math.abs(d.diferenca)}`;
      else situacao = `SOBRA ${d.diferenca}`;
      if (vencido) situacao += ' (VENCIDO)';

      const validadeTxt = d.validade ? new Date(d.validade+'T00:00:00').toLocaleDateString('pt-BR') : '';
      return [d.produto, d.unidade || '', d.quantidade_sistema, d.quantidade_contada, validadeTxt, situacao];
    });

    doc.autoTable({
      startY: 41,
      head: [['Produto', 'Un', 'Sistema', 'Contado', 'Validade', 'Situação']],
      body: linhas,
      styles: { fontSize: 8.5, cellPadding: 2.2 },
      headStyles: { fillColor: [15, 61, 46], textColor: 255 },
      columnStyles: { 5: { fontStyle: 'bold' } },
      didParseCell: (data) => {
        if (data.section === 'body' && data.column.index === 5){
          const texto = data.cell.raw;
          if (texto.includes('VENCIDO')){ data.cell.styles.textColor = [192, 57, 43]; }
          else if (texto === 'OK'){ data.cell.styles.textColor = [46, 125, 79]; }
          else if (texto.startsWith('FALTA')){ data.cell.styles.textColor = [192, 57, 43]; }
          else { data.cell.styles.textColor = [138, 109, 0]; }
        }
      }
    });

    const nomeArquivo = `conferencia_${empresa.replace(/\s+/g,'_')}_${dataFormatada.replace(/\//g,'-')}.pdf`;
    const pdfBlob = doc.output('blob');
    const pdfFile = new File([pdfBlob], nomeArquivo, { type: 'application/pdf' });

    // o PDF já foi gerado com sucesso aqui, então finaliza a sessão
    // independentemente do usuário concluir ou cancelar o compartilhamento
    marcarFinalizada(loja);
    carregarConferencias();
    atualizarResumoDia();

    // no celular, abre direto o menu de compartilhar (WhatsApp etc). No PC, baixa o arquivo.
    try {
      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })){
        await navigator.share({
          files: [pdfFile],
          title: 'Conferência de Estoque',
          text: `Conferência - ${empresa} - ${dataFormatada}`
        });
      } else {
        doc.save(nomeArquivo);
      }
    } catch(shareErr){
      // usuário cancelou o menu de compartilhar (AbortError) ou algo do tipo -
      // o PDF já foi gerado certinho, então não é um erro real, só ignora
      if (shareErr.name !== 'AbortError') console.error(shareErr);
    }
  } catch(e){
    alert('Erro ao gerar o PDF. Tente de novo.');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '📄 Finalizar conferência (gerar PDF)';
  }
});

// --- divergências recorrentes (histórico completo, agrupado por loja+produto) ---
document.getElementById('btn-recorrente').addEventListener('click', async () => {
  const btn = document.getElementById('btn-recorrente');
  const lista = document.getElementById('lista-recorrentes');

  if (lista.style.display === 'block'){
    lista.style.display = 'none';
    btn.textContent = '🔎 Ver divergências recorrentes';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Carregando...';
  try {
    const url = `${SUPABASE_URL}/rest/v1/conferencias?select=loja,empresa,produto,unidade,diferenca,criado_em&diferenca=neq.0&order=criado_em.desc&limit=500`;
    const resp = await fetch(url, { headers: headers() });
    const dados = await resp.json();

    if (!dados.length){
      lista.innerHTML = '<div class="vazio">Nenhuma divergência registrada ainda.</div>';
      lista.style.display = 'block';
      btn.textContent = '🔎 Ver divergências recorrentes';
      return;
    }

    const agrupado = {};
    dados.forEach(d => {
      const chave = `${d.loja}||${d.produto}`;
      if (!agrupado[chave]){
        agrupado[chave] = { empresa: d.empresa, produto: d.produto, unidade: d.unidade, count: 0, ultima: d.criado_em };
      }
      agrupado[chave].count += 1;
      if (d.criado_em > agrupado[chave].ultima) agrupado[chave].ultima = d.criado_em;
    });

    const ranking = Object.values(agrupado)
      .filter(item => item.count > 1) // só mostra o que já divergiu mais de uma vez
      .sort((a, b) => b.count - a.count)
      .slice(0, 15);

    if (!ranking.length){
      lista.innerHTML = '<div class="vazio">Nenhum produto divergiu mais de uma vez ainda — bom sinal!</div>';
    } else {
      lista.innerHTML = ranking.map(item => {
        const dataUlt = new Date(item.ultima).toLocaleDateString('pt-BR');
        return `
          <div class="rec-item">
            <div>
              <div class="rec-nome">${item.produto}</div>
              <div class="rec-meta">${item.empresa} · última vez em ${dataUlt}</div>
            </div>
            <span class="rec-count">${item.count}x</span>
          </div>`;
      }).join('');
    }

    lista.style.display = 'block';
    btn.textContent = '🔎 Ocultar divergências recorrentes';
  } catch(e){
    lista.innerHTML = '<div class="vazio">Erro ao carregar</div>';
    lista.style.display = 'block';
    console.error(e);
  } finally {
    btn.disabled = false;
  }
});
