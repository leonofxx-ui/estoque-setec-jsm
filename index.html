<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setec / JSM — Consulta de Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#12211a; --paper:#f6f4ec; --card:#ffffff;
  --leaf:#2f6b4f; --leaf-dark:#1f4a37; --leaf-soft:#e5efe7;
  --gold:#c8952b; --gold-soft:#f6ecd4;
  --line:#e2ddce; --muted:#6d7a6f; --danger:#c0392b; --danger-soft:#fbe6e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

header{background:linear-gradient(150deg,var(--leaf-dark),var(--leaf));color:#fff;padding:28px 0 24px}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;letter-spacing:1px;border:1px solid rgba(255,255,255,.25)}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:12.5px;opacity:.82;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.season{text-align:right}
.season .safra{font-size:20px;font-weight:800;letter-spacing:1px}
.season .lbl{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:2px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 16px;min-width:110px}
.stat .n{font-size:22px;font-weight:800;line-height:1}
.stat .t{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:1px;margin-top:4px}

.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid rgba(255,255,255,.2)}
.tab{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;font-family:inherit}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--gold)}

.controls{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.ctrl-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
.search input:focus{border-color:var(--leaf)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);outline:none;cursor:pointer;min-width:150px}
select:focus{border-color:var(--leaf)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s}
.chip.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.chip.esp.on{background:var(--gold);border-color:var(--gold)}

main{padding:22px 0 60px}
.count-line{font-size:13px;color:var(--muted);margin-bottom:16px;font-weight:500}
.count-line b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,74,55,.09)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-fab{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--leaf);background:var(--leaf-soft);padding:3px 9px;border-radius:6px}
.pc-fab.jsm{color:var(--gold);background:var(--gold-soft)}
.pc-name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25}

.pc-empresas{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.pc-empresa-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pc-empresa-row b{color:var(--ink);font-weight:700}
.pc-total-row{display:flex;justify-content:space-between;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.pc-total-row .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pc-total-row .val{font-size:20px;font-weight:800;color:var(--leaf-dark)}

.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--leaf-dark);color:#fff;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{background:var(--leaf)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--leaf-soft)}
tbody tr:last-child td{border-bottom:0}
.t-fab{font-weight:700;color:var(--leaf);font-size:11.5px}
.t-name{font-weight:600}
.t-qtd{font-weight:800;color:var(--leaf-dark);text-align:right;white-space:nowrap}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{opacity:.3;margin-bottom:12px}
.empty p{font-size:15px}

.view-toggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.view-toggle button{border:0;background:#fff;padding:10px 14px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.view-toggle button.on{background:var(--leaf);color:#fff}

.icon-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{border-color:var(--leaf);color:var(--leaf)}
.icon-btn.spinning svg{animation:spin .6s linear}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.hide-zero{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;padding:0 4px}
.hide-zero input{accent-color:var(--leaf);width:15px;height:15px;cursor:pointer}

.zerado{opacity:.5}
.zerado .pc-total-row .val{color:var(--muted)}
.badge-zero{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--danger);background:var(--danger-soft);padding:2px 7px;border-radius:5px;margin-left:6px}

.sort-arrow{opacity:.4;font-size:10px;margin-left:4px}
.sort-arrow.on{opacity:1}

.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.skel-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;height:118px;position:relative;overflow:hidden}
.skel-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.04),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

footer{border-top:1px solid var(--line);padding:20px 0;text-align:center;font-size:12px;color:var(--muted)}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .season{text-align:left}
  .brand h1{font-size:18px}
  .tab{padding:10px 13px;font-size:13px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-top">
      <div class="brand">
        <div class="logo">SA</div>
        <div>
          <h1>Setec Agro</h1>
          <div class="sub">Consulta de Estoque</div>
        </div>
      </div>
      <div class="season">
        <div class="safra" id="dataRef">--/--/----</div>
        <div class="lbl">Atualizado em</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="statProdutos">–</div><div class="t">Produtos</div></div>
      <div class="stat"><div class="n" id="statEmpresas">9</div><div class="t">Empresas</div></div>
      <div class="stat"><div class="n" id="statTerceiros">–</div><div class="t">Com terceiros</div></div>
    </div>

    <div class="tabs">
      <button class="tab on" data-grupo="ALL">Todos</button>
      <button class="tab" data-grupo="SETEC">SETEC</button>
      <button class="tab" data-grupo="JSM">JSM</button>
      <button class="tab" data-grupo="TERCEIROS">Com terceiros</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="ctrl-row">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Buscar produto...">
      </div>
      <select id="empresaSel"><option value="ALL">Todas as empresas</option></select>
      <label class="hide-zero"><input type="checkbox" id="ocultarZerados"> Ocultar zerados</label>
      <button class="icon-btn" id="btnRefresh" title="Atualizar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <div class="view-toggle">
        <button id="vGrid" class="on">Cards</button>
        <button id="vTable">Tabela</button>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="count-line" id="countLine">Carregando...</div>
    <div id="content"></div>
  </div>
</main>

<footer>Setec Agro / JSM &middot; dados extraídos do Siagri Agribusiness</footer>

<script>
// ---- Configuração do Supabase ----
const SUPABASE_URL = "https://wmgudywwvfzzsjjshezv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtZ3VkeXd3dmZ6enNqanNoZXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTcwMzEsImV4cCI6MjEwMjEzMzAzMX0.c6aeTOpeqOlcHjvZHmXXhya9VsWB-q1SR2oxiMEpO4s";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let disponivel = [];
let terceiros = [];
let grupoAtivo = "ALL";
let view = "grid";
let ocultarZerados = false;
let sortCampo = null;
let sortDir = 1;

function skeletonGrid(qtd){
  let cards = "";
  for(let i=0;i<qtd;i++) cards += `<div class="skel-card"></div>`;
  return `<div class="skeleton-grid">${cards}</div>`;
}

async function carregar(){
  document.getElementById("content").innerHTML = skeletonGrid(6);

  const { data: d1 } = await sb.from("estoque").select("*");
  const { data: d2 } = await sb.from("estoque_terceiros").select("*");
  disponivel = d1 || [];
  terceiros = d2 || [];

  if(disponivel.length){
    document.getElementById("dataRef").textContent = formatarDataBR(disponivel[0].data_ref);
  }
  document.getElementById("statTerceiros").textContent = terceiros.length;

  const empresaAtual = document.getElementById("empresaSel").value;
  const empresas = [...new Set(disponivel.map(r => r.empresa))].sort();
  const empresaSel = document.getElementById("empresaSel");
  empresaSel.innerHTML = `<option value="ALL">Todas as empresas</option>`;
  empresas.forEach(e => {
    const opt = document.createElement("option");
    opt.value = e; opt.textContent = e;
    empresaSel.appendChild(opt);
  });
  if(empresas.includes(empresaAtual)) empresaSel.value = empresaAtual;

  render();
}

function nomeBaseProduto(produto){
  // Remove o sufixo de CST no final do nome, ex: "ENGEO PLENO S (1X20LT) - 040" -> "ENGEO PLENO S (1X20LT)"
  // e também quando vem com o princípio ativo depois, ex: "ACTARA 250 WG (4X5KG) - 540 - (TIAMETOXAM)"
  return produto
    .replace(/\s*-\s*\d{2,4}\s*-\s*\([^)]*\)\s*$/, "")
    .replace(/\s*-\s*\d{2,4}\s*$/, "")
    .trim();
}

function nomeDepositante(nome){
  // A empresa 781 (JSM COMERCIO E REPRESENTACAO) é o depósito do aeroporto.
  // Mostra um nome mais claro em vez do código/razão social original.
  if(!nome) return nome;
  if(nome.trim().startsWith("781")) return "JSM DEPOSITO AEROPORTO";
  return nome;
}

function agruparPorProduto(lista){
  const mapa = {};
  lista.forEach(r => {
    const chave = nomeBaseProduto(r.produto);
    if(!mapa[chave]) mapa[chave] = [];
    mapa[chave].push(r);
  });
  return mapa;
}

function agruparPorEmpresa(regs){
  // Soma as quantidades de diferentes CST do mesmo produto, por empresa
  const porEmpresa = {};
  regs.forEach(r => {
    if(!porEmpresa[r.empresa]) porEmpresa[r.empresa] = 0;
    porEmpresa[r.empresa] += Number(r.estoque_disponivel);
  });
  return porEmpresa;
}

function render(){
  const termo = document.getElementById("q").value.trim().toLowerCase();
  const empresaFiltro = document.getElementById("empresaSel").value;

  if(grupoAtivo === "TERCEIROS"){
    renderTerceiros(termo);
    return;
  }

  let filtrado = disponivel.filter(r => {
    if(grupoAtivo !== "ALL" && r.grupo !== grupoAtivo) return false;
    if(empresaFiltro !== "ALL" && r.empresa !== empresaFiltro) return false;
    if(termo && !r.produto.toLowerCase().includes(termo)) return false;
    return true;
  });

  const porProdutoTudo = agruparPorProduto(filtrado);
  let nomes = Object.keys(porProdutoTudo).sort();

  // calcula o total de cada produto uma vez, pra usar no filtro e na ordenação
  const totais = {};
  nomes.forEach(nome => {
    const porEmpresa = agruparPorEmpresa(porProdutoTudo[nome]);
    totais[nome] = Object.values(porEmpresa).reduce((s,v)=>s+v,0);
  });

  if(ocultarZerados){
    nomes = nomes.filter(nome => totais[nome] > 0);
  }

  const porProduto = {};
  nomes.forEach(nome => porProduto[nome] = porProdutoTudo[nome]);

  document.getElementById("statProdutos").textContent = nomes.length;
  document.getElementById("countLine").innerHTML =
    `Exibindo <b>${nomes.length}</b> produto${nomes.length===1?'':'s'}`;

  const content = document.getElementById("content");

  if(nomes.length === 0){
    content.innerHTML = `<div class="empty"><p>Nenhum produto encontrado.</p></div>`;
    return;
  }

  if(view === "grid"){
    content.innerHTML = `<div class="grid">` + nomes.map(nome => {
      const regs = porProduto[nome];
      const porEmpresa = agruparPorEmpresa(regs);
      const empresasOrdenadas = Object.keys(porEmpresa).sort();
      const total = totais[nome];
      const grupo = regs[0].grupo;
      const linhas = empresasOrdenadas.map(e =>
        `<div class="pc-empresa-row"><span>${e}</span><b>${fmt(porEmpresa[e])}</b></div>`
      ).join("");
      return `<div class="pcard ${total===0?'zerado':''}">
        <div class="pc-top">
          <span class="pc-fab ${grupo==='JSM'?'jsm':''}">${grupo}</span>
          ${total===0?'<span class="badge-zero">Sem estoque</span>':''}
        </div>
        <div class="pc-name">${nome}</div>
        <div class="pc-empresas">
          ${linhas}
          <div class="pc-total-row"><span class="lbl">Total</span><span class="val">${fmt(total)}</span></div>
        </div>
      </div>`;
    }).join("") + `</div>`;
  } else {
    let linhas = [];
    nomes.forEach(nome => {
      const regs = porProduto[nome];
      const porEmpresa = agruparPorEmpresa(regs);
      const grupo = regs[0].grupo;
      Object.keys(porEmpresa).sort().forEach(empresa => {
        linhas.push({ grupo, produto: nome, empresa, qtd: porEmpresa[empresa] });
      });
    });

    linhas = ordenarLinhas(linhas);

    let rows = linhas.map(l => `<tr class="${l.qtd===0?'zerado':''}">
      <td class="t-fab">${l.grupo}</td>
      <td class="t-name">${l.produto}</td>
      <td>${l.empresa}</td>
      <td class="t-qtd">${fmt(l.qtd)}${l.qtd===0?' <span class="badge-zero">0</span>':''}</td>
    </tr>`).join("");

    content.innerHTML = `<div class="tbl-wrap"><table>
      <thead><tr>
        ${cabecalhoOrdenavel("grupo","Grupo")}
        ${cabecalhoOrdenavel("produto","Produto")}
        ${cabecalhoOrdenavel("empresa","Empresa")}
        ${cabecalhoOrdenavel("qtd","Estoque")}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

    document.querySelectorAll("th[data-campo]").forEach(th => {
      th.addEventListener("click", () => {
        const campo = th.dataset.campo;
        if(sortCampo === campo){ sortDir = -sortDir; } else { sortCampo = campo; sortDir = 1; }
        render();
      });
    });
  }
}

function cabecalhoOrdenavel(campo, label){
  const ativo = sortCampo === campo;
  const seta = ativo ? (sortDir === 1 ? "▲" : "▼") : "▲▼";
  return `<th data-campo="${campo}">${label} <span class="sort-arrow ${ativo?'on':''}">${seta}</span></th>`;
}

function ordenarLinhas(linhas){
  if(!sortCampo) return linhas;
  return [...linhas].sort((a,b) => {
    const va = a[sortCampo], vb = b[sortCampo];
    if(typeof va === "number") return (va - vb) * sortDir;
    return String(va).localeCompare(String(vb), 'pt-BR') * sortDir;
  });
}

function renderTerceiros(termo){
  const filtrado = terceiros.filter(r => !termo || r.produto.toLowerCase().includes(termo));

  // Agrupa por (nome base do produto + depositante), somando as variações de CST
  const mapa = {};
  filtrado.forEach(r => {
    const depositanteExibido = nomeDepositante(r.depositante) || "-";
    const chave = nomeBaseProduto(r.produto) + "||" + depositanteExibido;
    if(!mapa[chave]){
      mapa[chave] = { nome: nomeBaseProduto(r.produto), depositante: depositanteExibido, qtd: 0, unidade: r.unidade || "" };
    }
    mapa[chave].qtd += Number(r.estoque_disponivel);
  });

  let itens = Object.values(mapa);
  if(ocultarZerados) itens = itens.filter(item => item.qtd > 0);

  document.getElementById("countLine").innerHTML =
    `Exibindo <b>${itens.length}</b> item${itens.length===1?'':'ns'} armazenados com terceiros`;

  const content = document.getElementById("content");
  if(itens.length === 0){
    content.innerHTML = `<div class="empty"><p>Nenhum item encontrado.</p></div>`;
    return;
  }

  const linhas = ordenarLinhas(itens.map(item => ({ produto: item.nome, depositante: item.depositante, qtd: item.qtd, unidade: item.unidade })));

  let rows = linhas.map(item => `<tr class="${item.qtd===0?'zerado':''}">
    <td class="t-name">${item.produto}</td>
    <td>${item.depositante}</td>
    <td class="t-qtd">${fmt(item.qtd)} ${item.unidade}${item.qtd===0?' <span class="badge-zero">0</span>':''}</td>
  </tr>`).join("");
  content.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr>
      ${cabecalhoOrdenavel("produto","Produto")}
      ${cabecalhoOrdenavel("depositante","Depositante")}
      ${cabecalhoOrdenavel("qtd","Quantidade")}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  document.querySelectorAll("th[data-campo]").forEach(th => {
    th.addEventListener("click", () => {
      const campo = th.dataset.campo;
      if(sortCampo === campo){ sortDir = -sortDir; } else { sortCampo = campo; sortDir = 1; }
      render();
    });
  });
}

function fmt(n){
  return Number(n).toLocaleString('pt-BR', {maximumFractionDigits:0});
}

function formatarDataBR(isoDate){
  // Converte "2026-08-18" -> "18/08/2026" sem passar pelo objeto Date,
  // evitando o problema de fuso horário que faz a data "voltar" um dia.
  if(!isoDate) return '--/--/----';
  const partes = isoDate.split('-');
  if(partes.length !== 3) return '--/--/----';
  const [ano, mes, dia] = partes;
  return `${dia}/${mes}/${ano}`;
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    grupoAtivo = btn.dataset.grupo;
    render();
  });
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("empresaSel").addEventListener("change", render);
document.getElementById("ocultarZerados").addEventListener("change", (e) => {
  ocultarZerados = e.target.checked;
  render();
});
document.getElementById("btnRefresh").addEventListener("click", async () => {
  const btn = document.getElementById("btnRefresh");
  btn.classList.add("spinning");
  await carregar();
  btn.classList.remove("spinning");
});
document.getElementById("vGrid").addEventListener("click", () => { view="grid"; document.getElementById("vGrid").classList.add("on"); document.getElementById("vTable").classList.remove("on"); render(); });
document.getElementById("vTable").addEventListener("click", () => { view="table"; document.getElementById("vTable").classList.add("on"); document.getElementById("vGrid").classList.remove("on"); render(); });

carregar();
</script>
